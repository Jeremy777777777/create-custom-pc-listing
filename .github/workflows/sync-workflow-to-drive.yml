name: Optional manual runner backup to Google Drive

on:
  # User-selected default is manual connected-tool synchronization.
  # Do not trigger credential failures on every push or validation completion.
  workflow_dispatch:
    inputs:
      publish_current:
        description: Publish a fully validated main snapshot explicitly
        type: boolean
        default: false
      validation_run_id:
        description: Actual successful validation run ID when publishing
        type: string
        required: false

permissions:
  contents: read
  actions: read

# Serialize explicitly requested manual runner backups.
concurrency:
  group: github-drive-repository-sync
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # The engine and config come from main. Branch contents are read as data;
      # no scripts, dependency installers or artifacts from that branch run.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install sync adapter in the isolated runner
        run: python -m pip install -r engine/scripts/requirements-drive-sync.txt
      - name: Back up commit and optionally publish validated main
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          PROMOTE_CURRENT: ${{ inputs.publish_current }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          args=()
          if [ "$PROMOTE_CURRENT" = "true" ]; then
            args+=(--promote --ci-run-id "$VALIDATION_RUN_ID")
          fi
          python engine/scripts/github_drive_sync.py \
            --source source --config engine/assets/github-drive-sync.json \
            --commit "$SOURCE_COMMIT" --repository "$GITHUB_REPOSITORY" \
            --branch "$SOURCE_BRANCH" --output drive-sync-result.json "${args[@]}"
      - name: Preserve actual sync status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drive-sync-result-${{ github.run_id }}
          path: drive-sync-result.json
          if-no-files-found: warn

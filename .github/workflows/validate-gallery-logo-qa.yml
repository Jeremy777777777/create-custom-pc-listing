name: Validate current gallery delivery
on:
  pull_request:
    paths: ['SKILL.md', 'README.md', 'references/**', 'scripts/**', '.github/**', 'product generated photo/**']
  push:
    branches: [main]
    paths: ['SKILL.md', 'README.md', 'references/**', 'scripts/**', '.github/**', 'product generated photo/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts/tests -v
      - name: Validate eligible canonical galleries and changed quarantined images
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            python scripts/gallery_engine.py gate --directory .
          else
            python scripts/gallery_engine.py gate --directory . --base "$BASE" --head "$HEAD"
          fi

name: Validate current gallery delivery
on:
  pull_request:
    paths: ['AGENTS.md', 'SKILL.md', 'README.md', 'references/**', 'assets/**', 'scripts/**', 'local-testing/**', '.github/**', 'product generated photo/**']
  push:
    branches: [main]
    paths: ['AGENTS.md', 'SKILL.md', 'README.md', 'references/**', 'assets/**', 'scripts/**', 'local-testing/**', '.github/**', 'product generated photo/**']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts/tests -v
      - name: Validate current workbook structure
        run: python scripts/check-workbooks.py --directory .
      - name: Validate eligible canonical galleries and changed quarantined images
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            python scripts/gallery_engine.py gate --directory .
          else
            python scripts/gallery_engine.py gate --directory . --base "$BASE" --head "$HEAD"
          fi
      - name: Retain check scope summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-check-summaries
          path: |
            gallery-ci-summary.json
            workbook-ci-summary.json
          if-no-files-found: ignore

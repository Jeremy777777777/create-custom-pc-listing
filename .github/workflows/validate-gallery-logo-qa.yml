name: Validate workflow and retained product fixtures
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts/tests -v
      - name: Verify reusable original brand assets
        run: python scripts/brand_assets.py verify --repo .
      - name: Keep final product outputs in Google Drive
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check-storage-boundary.py --directory . --base "$BASE" --head "$HEAD"
          fi
      - name: Validate current workbook structure
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            python scripts/check-workbooks.py --directory .
          else
            python scripts/check-workbooks.py --directory . --base "$BASE" --head "$HEAD"
          fi
      - name: Validate eligible canonical galleries and changed quarantined images
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            python scripts/gallery_engine.py gate --directory .
          else
            python scripts/gallery_engine.py gate --directory . --base "$BASE" --head "$HEAD"
          fi
      - name: Retain check scope summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-check-summaries
          path: |
            gallery-ci-summary.json
            workbook-ci-summary.json
          if-no-files-found: ignore
